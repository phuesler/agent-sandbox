AGENT_DESC="Gemini CLI (Google)"
# Start command per permission mode (abox set mode=ask|auto|bypass; default auto)
AGENT_CMD_ASK="gemini --approval-mode default"
AGENT_CMD_AUTO="gemini --approval-mode auto_edit"
AGENT_CMD_BYPASS="gemini --yolo"
AGENT_NIXPKG="gemini-cli"
AGENT_AUTH="abox secret set GEMINI_API_KEY <file> (Google-account login uses a browser callback that can't reach the sandbox)"

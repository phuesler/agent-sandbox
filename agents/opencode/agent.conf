AGENT_DESC="opencode (multi-provider)"
# Start command per permission mode (abox set mode=ask|auto|bypass; default auto)
AGENT_CMD_ASK="env OPENCODE_CONFIG=$HOME/.config/opencode/abox-ask.json opencode"
AGENT_CMD_AUTO="env OPENCODE_CONFIG=$HOME/.config/opencode/abox-auto.json opencode"
AGENT_CMD_BYPASS="env OPENCODE_CONFIG=$HOME/.config/opencode/abox-bypass.json opencode"
AGENT_NIXPKG="opencode"
AGENT_AUTH="opencode auth login (inside the sandbox), or provider keys via abox secret set (e.g. ANTHROPIC_API_KEY, OPENAI_API_KEY, OPENROUTER_API_KEY); other providers: add their API host to egress/allowlist.txt"
